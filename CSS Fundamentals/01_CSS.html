<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 70%;
        }
        h2{
            color: rgb(189, 179, 174);
            background-color: rgb(236, 12, 12);
            width: 520px;
            font-family: 'Courier New', Courier, monospace;
            padding-left: 25px;
            align-items: center;
        }
        /* . is used if we have class  */
        .accounts{
            color: rgb(15, 11, 103);
        }
        /* # is used when we have id  */
        #youtube{
            color: rgb(79, 255, 35);
            font-size: medium;
        }
        *{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

    </style>
</head >
<body >
    <!-- inline styling -->
    <h1 style="color: rgb(221, 0, 99); height: 50px ;width: 520px;background-color: rgb(255, 52, 52) ;padding-top: 5px;padding-left: 30px;font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;"  >Welcome to CreatorSparkStudio</h1>

    <h2>This studio is for you creators</h2>

    <!-- both the class name or id can be used as selector  -->
    <p class="accounts " >We are active on ........</p>
    <p id="youtube">Youtube</p>
</body>
</html>
