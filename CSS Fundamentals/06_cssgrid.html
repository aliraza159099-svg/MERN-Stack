<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 20px;
            background-color: #121212; 
        }
        .container{
            display: grid;
            align-items: center;
            /* grid-template-columns: 200px 200px 200px; */
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .box{
            color: blue;
            background-color: antiquewhite;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
            border: 2px solid brown;
            height: 38px;
            border-radius: 7px;
            align-items: center;
            padding: 45px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
    </div>
</body>
</html>
