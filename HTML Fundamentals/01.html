<!DOCTYPE html>
<html>
    <!-- head is concern with the browser it tells browser how to open file  -->
    <head>
        <title>My website</title>
        <!-- this meta tag render web server to read and work with any language  -->
        <meta charset="UTF-8" />
        <!-- these meta tags help to view  al cahracters and rank our website  -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="My website">
    </head>

    <!-- body elements are supposed to show with the user  -->
    <body>
        <!-- <h1> Hello World!</h1> -->
        <!-- best practice to increase readability  -->
        <header></header>
        <nav></nav>
        <main></main>
        <article></article>
        <footer></footer>
    </body>
</html>
